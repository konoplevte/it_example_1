[project]
name = "taskagent"
version = "0.1.0"
description = "ИИ агент для работы с задачами"
readme = "README.md"
authors = [
    { name = "Коноплев Тимур Евгеньевич", email = "konoplevte@mai.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
taskagent = "taskagent.taskagent:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
